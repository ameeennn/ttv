  <title>TTV - AI Video Generator</title>
  <style>
    /* Your existing CSS code remains here */
    :root {
      --bg-primary: #0e0f12;
      --bg-secondary: #16181d;
      --text-primary: #eaeaea;
      --text-secondary: #9aa4af;
      --accent: #00ffc8;
      --accent-hover: #00d7aa;
      --border: #262b33;
      --shadow: rgba(0,0,0,.45);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #0c0d10, #0e1015 35%, #0b0c10 100%);
      color: var(--text-primary);
      overflow: hidden;
    }
    .container { display: flex; height: 100%; flex-direction: column; }
    .header {
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(15,17,22,.6);
      backdrop-filter: blur(6px);
    }
    .brand {
      flex: 1;
      text-align: center;
      font-weight: 800;
      letter-spacing: .02em;
    }
    .brand span { color: var(--accent); }
    #chat {
      flex: 1;
      overflow: auto;
      padding: 18px 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .message {
      max-width: min(82%, 720px);
      padding: 12px 14px;
      border-radius: 16px;
      box-shadow: 0 2px 6px var(--shadow);
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .message.user {
      align-self: flex-end;
      background: var(--accent);
      color: #041013;
    }
    .message.ai {
      align-self: flex-start;
      background: #151922;
      border: 1px solid var(--border);
    }
    .message.ai a {
      color: var(--accent);
      text-decoration: none;
    }
    .message.ai a:hover { text-decoration: underline; }
    .input-area {
      border-top: 1px solid var(--border);
      padding: 10px;
      display: flex;
      gap: 8px;
      background: #0e1015;
    }
    textarea {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #12151a;
      color: var(--text-primary);
      padding: 12px 14px;
      font-size: 15px;
      resize: none;
      min-height: 22px;
      max-height: 160px;
      overflow: auto;
    }
    .send-btn {
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #041013;
      font-weight: 900;
      cursor: pointer;
    }
    .send-btn:hover { background: var(--accent-hover); }
    @media (max-width: 820px) {
      .brand { font-size: 16px; }
      .message { max-width: 92%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">TTV — AI <span>Video Generator</span></div>
    </header>
    <section id="chat"></section>
    <div class="input-area">
      <textarea id="userInput" placeholder="Describe the video you want to generate..."></textarea>
      <button class="send-btn" onclick="window.sendMessage()">Generate</button>
    </div>
  </div>
  <script type="module">
    const chatEl = document.getElementById("chat");
    const userInput = document.getElementById("userInput");

    const API_URL = "https://ai-backend-xj58.onrender.com"; // Your Render backend URL

    function scrollChatToBottom() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function addMsg(role, content) {
      const d = document.createElement("div");
      d.className = `message ${role === "user" ? "user" : "ai"}`;
      d.innerHTML = content;
      chatEl.appendChild(d);
      scrollChatToBottom();
      return d; // Return the created element
    }

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        window.sendMessage();
      }
    });

    window.sendMessage = async function() {
      const message = userInput.value.trim();
      if (!message) return;
      addMsg("user", message);
      userInput.value = "";
      
      const aiDiv = addMsg("ai", "Generating video...");
      
      try {
        const res = await fetch(`${API_URL}/generate-video`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: message }),
        });
        
        const data = await res.json();
        
        if (!res.ok) {
          aiDiv.innerText = `Error: ${data.error || 'Unknown error'}`;
        } else if (data.videoUrl) {
          aiDiv.innerHTML = `Video generated successfully! <a href="${data.videoUrl}" target="_blank">View Video</a>`;
        } else {
          aiDiv.innerText = "Error: No video URL received.";
        }
      } catch (error) {
        aiDiv.innerText = "Error: Could not connect to video generation service.";
        console.error("Video generation error:", error);
      }
      scrollChatToBottom();
    }
  </script>
</body>
</html>
